version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: term_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bookstore_term
      MYSQL_USER: bookstore
      MYSQL_PASSWORD: bookstore123
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - term_net

  redis:
    image: redis:7
    container_name: term_redis
    restart: always
    networks:
      - term_net

  backend:
    build: ./backend
    container_name: term_backend
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      - mysql
      - redis
    volumes:
      - ./backend/firebase-admin.json:/app/firebase-admin.json
    ports:
      - "13089:3000"
    networks:
      - term_net

  frontend:
    build: ./frontend
    container_name: term_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "18089:80"
    networks:
      - term_net

volumes:
  mysql_data:

networks:
  term_net:

